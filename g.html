<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>XAM AI - Dashboard</title>
<style>
:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --primary:#6366f1;
  --premium:#f59e0b;
  --soft:#eef2ff;
  --text:#1f2937;
}
body{font-family:Poppins,Arial,sans-serif;background:var(--bg);padding:40px;color:var(--text)}
.header{max-width:760px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.plan-badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:600}
.plan-free{background:#e5e7eb;color:#374151}
.plan-premium{background:var(--premium);color:#fff}
.chat-box{background:var(--card);padding:20px;border-radius:20px;max-width:760px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,0.1)}
textarea{width:100%;height:110px;margin:10px 0;padding:12px;border:1px solid #d7deea;border-radius:10px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{background:var(--primary);color:white;padding:10px 16px;border:none;border-radius:8px;cursor:pointer}
button.secondary{background:#0ea5e9}
.response{margin-top:20px;background:var(--soft);padding:15px;border-radius:10px;min-height:64px;white-space:pre-wrap}
.helper{font-size:13px;color:#6b7280;margin-top:8px}
.hidden{display:none}
</style>
</head>
<body>

<div class="header">
  <h2 style="margin:0;">XAM AI</h2>
  <div id="planBadge" class="plan-badge">Plan</div>
</div>

<div class="chat-box">
  <div id="premiumTools" class="row hidden">
    <button class="secondary" onclick="setPromptMode('step')">Resolution etape par etape</button>
    <button class="secondary" onclick="setPromptMode('coach')">Mode coach examen</button>
  </div>

  <textarea id="question" placeholder="Pose ta question..."></textarea>

  <div class="row">
    <button onclick="askAI()">Envoyer</button>
    <button onclick="logout()">Changer de plan</button>
  </div>

  <div class="helper" id="helperText"></div>
  <div id="response" class="response"></div>
</div>

<script>
const plan = localStorage.getItem("xam_plan") || "free";
let promptMode = "normal";

const planBadge = document.getElementById("planBadge");
const helperText = document.getElementById("helperText");
const premiumTools = document.getElementById("premiumTools");

if (plan === "premium") {
  planBadge.textContent = "Premium IA";
  planBadge.className = "plan-badge plan-premium";
  helperText.textContent = "Mode Premium actif: corrections detaillees, methode et accompagnement type Gauth.";
  premiumTools.classList.remove("hidden");
} else {
  planBadge.textContent = "Gratuit";
  planBadge.className = "plan-badge plan-free";
  helperText.textContent = "Mode gratuit actif: reponses standard.";
}

function setPromptMode(mode){
  promptMode = mode;
}

function enrichQuestion(question){
  if (plan !== "premium") return question;
  if (promptMode === "step") return "Donne une resolution etape par etape avec explications claires:\n" + question;
  if (promptMode === "coach") return "Agis comme un coach Bac: corrige, explique les erreurs frequentes et donne une methode:\n" + question;
  return question;
}

async function askAI(){
  const questionInput = document.getElementById("question");
  const responseBox = document.getElementById("response");
  const rawQuestion = questionInput.value.trim();

  if (!rawQuestion) {
    responseBox.innerText = "Ecris une question avant d'envoyer.";
    return;
  }

  responseBox.innerText = "Chargement...";

  try {
    const res = await fetch("http://localhost:3000/ask", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        question: enrichQuestion(rawQuestion),
        plan: plan
      })
    });

    if (!res.ok) throw new Error("Erreur serveur");

    const data = await res.json();
    responseBox.innerText = data.answer || "Pas de reponse.";
  } catch (error) {
    responseBox.innerText = "Erreur IA: verifie que ton serveur Node tourne sur http://localhost:3000.";
  }
}

function logout(){
  window.location.href = "test.html";
}
</script>

</body>
</html>
